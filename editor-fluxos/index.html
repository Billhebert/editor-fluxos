<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
    <title>FLUXO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
        .header { background: #1a1a2e; border-bottom: 1px solid #333; padding: 16px 24px; display: flex; align-items: center; gap: 16px; -webkit-app-region: drag; }
        .header h1 { font-size: 20px; font-weight: 600; color: #fff; }
        .header-actions { margin-left: auto; display: flex; gap: 8px; -webkit-app-region: no-drag; flex-wrap: wrap; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; }
        .btn-primary { background: #6c5ce7; color: #fff; }
        .btn-primary:hover { background: #5a4bd1; }
        .btn-success { background: #00b894; color: #fff; }
        .btn-success:hover { background: #00a381; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-outline { background: transparent; border: 1px solid #444; color: #ccc; }
        .btn-outline:hover { background: #222; border-color: #666; }
        .btn-warning { background: #e17055; color: #fff; }
        .btn-warning:hover { background: #d35d43; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .fluxos-grid { display: flex; flex-direction: column; gap: 16px; }
        .fluxo-card { background: #1a1a2e; border: 1px solid #333; border-radius: 10px; overflow: hidden; }
        .fluxo-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #16162a; border-bottom: 1px solid #333; }
        .fluxo-header input { background: transparent; border: none; color: #a29bfe; font-size: 16px; font-weight: 600; font-family: 'Consolas', monospace; flex: 1; }
        .fluxo-header input:focus { outline: none; }
        .fluxo-header .fluxo-label { color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .fluxo-body { padding: 12px; }
        .action-list { display: flex; flex-wrap: wrap; gap: 8px; min-height: 48px; padding: 8px; background: #0f0f0f; border-radius: 8px; border: 2px dashed #333; align-items: flex-start; align-content: flex-start; }
        .action-list:empty::before { content: 'Clique em Gravar para adicionar acoes', color: #555; font-size: 13px; }
        .action-item { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 6px; font-family: 'Consolas', monospace; font-size: 13px; cursor: grab; position: relative; user-select: none; }
        .action-item:active { cursor: grabbing; }
        .action-item .action-remove { opacity: 0; cursor: pointer; color: #e74c3c; font-weight: bold; margin-left: 4px; transition: opacity 0.1s; background: none; border: none; font-size: 12px; }
        .action-item:hover .action-remove { opacity: 1; }
        .action-key { background: #1f3d2d; border: 1px solid #00b894; color: #55efc4; }
        .action-text { background: #3d2d1f; border: 1px solid #e17055; color: #fab1a0; }
        .action-delay { background: #1f2d3d; border: 1px solid #74b9ff; color: #74b9ff; }
        .action-mouse { background: #3d1f2d; border: 1px solid #fd79a8; color: #fd79a8; }
        .action-obrigatorio { background: #5e3d1f; border: 1px solid #e17055; color: #fab1a0; }
        .action-opcional { background: #1f5e4a; border: 1px solid #00cec9; color: #81ecec; }
        .action-variable { background: #2d1f5e; border: 1px solid #6c5ce7; color: #a29bfe; }
        .drag-over { border-color: #6c5ce7 !important; background: #1a1a3e !important; }
        .recording-panel { display: none; background: #1a1a2e; border: 1px solid #333; border-radius: 10px; margin-bottom: 24px; overflow: hidden; }
        .recording-panel.active { display: block; }
        .recording-panel-header { padding: 12px 16px; background: #16162a; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; }
        .recording-panel-header h3 { font-size: 14px; color: #fff; }
        .recording-panel-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .recording-tabs { display: flex; gap: 4px; }
        .recording-tab { padding: 8px 16px; border: 1px solid #333; border-radius: 6px; background: transparent; color: #aaa; cursor: pointer; font-size: 13px; transition: all 0.15s; }
        .recording-tab:hover { background: #222; }
        .recording-tab.active { background: #6c5ce7; border-color: #6c5ce7; color: #fff; }
        .recording-section { display: none; }
        .recording-section.active { display: block; }
        .recording-recorded { display: flex; flex-wrap: wrap; gap: 4px; min-height: 36px; padding: 8px; background: #0f0f0f; border-radius: 6px; border: 1px dashed #444; align-items: flex-start; }
        .recording-recorded:empty::before { content: 'Nenhum item na fila', color: #555; font-size: 12px; }
        .record-btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; background: #e74c3c; color: #fff; }
        .record-btn:hover { background: #c0392b; }
        .record-btn.recording { animation: pulse 1s infinite; }
        .recording-active { animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .recording-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .keyboard-row { display: flex; gap: 4px; margin-bottom: 4px; justify-content: center; }
        .key-btn { min-width: 40px; height: 36px; background: #2d2d4a; border: 1px solid #444; border-radius: 4px; color: #fff; font-size: 11px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.1s; user-select: none; }
        .key-btn:hover { background: #3d3d5a; border-color: #6c5ce7; }
        .key-btn:active { background: #6c5ce7; transform: scale(0.95); }
        .mouse-coords { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .mouse-coords label { font-size: 12px; color: #aaa; }
        .mouse-coords input { width: 80px; background: #0f0f0f; border: 1px solid #444; border-radius: 4px; color: #fff; padding: 4px 8px; font-size: 12px; text-align: center; }
        .variable-tag { padding: 6px 12px; border-radius: 6px; font-family: 'Consolas', monospace; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .variable-tag.obrigatorio { background: #5e3d1f; border: 1px solid #e17055; color: #fab1a0; }
        .variable-tag.opcional { background: #1f5e4a; border: 1px solid #00cec9; color: #81ecec; }
        .variable-tag.custom { background: #2d1f5e; border: 1px solid #6c5ce7; color: #a29bfe; }
        .delay-options { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .delay-options input { width: 80px; background: #0f0f0f; border: 1px solid #444; border-radius: 4px; color: #fff; padding: 6px 10px; font-size: 13px; text-align: center; }
        .delay-preset { padding: 6px 12px; background: #1f2d3d; border: 1px solid #74b9ff; border-radius: 4px; color: #74b9ff; cursor: pointer; font-size: 12px; }
        .delay-preset:hover { background: #2f3d4d; }
        .file-info { font-size: 12px; color: #888; margin-left: 12px; }
        .version-label { font-size: 11px; color: #555; padding: 2px 8px; border: 1px solid #333; border-radius: 10px; background: #16162a; }
        .fluxo-card.running { border: 2px solid #00b894; }
        .action-item.executing { outline: 2px solid #00b894; z-index: 10; background: #1f3d2d; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-box { background: #1a1a2e; border: 1px solid #444; border-radius: 8px; padding: 24px; min-width: 350px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .modal-box h3 { margin: 0 0 16px 0; color: #fff; font-size: 16px; }
        .modal-box input { width: 100%; background: #0f0f0f; border: 1px solid #444; border-radius: 4px; color: #fff; padding: 10px 12px; font-size: 14px; box-sizing: border-box; }
        .modal-box input:focus { outline: none; border-color: #6c5ce7; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
        .modal-fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f0f; z-index: 9999; overflow-y: auto; padding: 24px; }
        .modal-fullscreen-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #333; }
        .modal-fullscreen-header h2 { color: #fff; font-size: 18px; }
        .modal-fullscreen-header .btn { margin-left: auto; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .data-table th { background: #16162a; color: #aaa; font-size: 12px; text-transform: uppercase; padding: 8px 12px; text-align: left; border-bottom: 1px solid #333; }
        .data-table td { padding: 8px 12px; border-bottom: 1px solid #222; font-size: 13px; }
        .data-table tr:hover td { background: #1a1a2e; }
        .data-table input { background: #0f0f0f; border: 1px solid #333; border-radius: 4px; color: #fff; padding: 4px 8px; font-size: 12px; width: 100%; }
        .data-table input:focus { outline: none; border-color: #6c5ce7; }
        .status-pending { color: #fdcb6e; }
        .status-running { color: #74b9ff; }
        .status-completed { color: #00b894; }
        .status-failed { color: #e74c3c; }
        .toast-container { position: fixed; top: 16px; right: 16px; z-index: 99999; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: #1a1a2e; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; min-width: 280px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 10px; }
        .toast.success { border-left: 4px solid #00b894; }
        .toast.error { border-left: 4px solid #e74c3c; }
        .toast.info { border-left: 4px solid #74b9ff; }
        .toast.warning { border-left: 4px solid #fdcb6e; background: #2d2310; }
        .toast-icon { font-size: 18px; }
        .toast-msg { font-size: 13px; color: #ddd; flex: 1; }
        .toast-close { cursor: pointer; color: #666; font-size: 14px; background: none; border: none; }
        .toast-close:hover { color: #fff; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .schedule-card { background: #1a1a2e; border: 1px solid #333; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
        .schedule-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .schedule-card-header h4 { color: #a29bfe; font-size: 14px; flex: 1; }
        .schedule-card-meta { font-size: 12px; color: #888; display: flex; gap: 16px; flex-wrap: wrap; }
        .schedule-card-meta span { display: flex; align-items: center; gap: 4px; }
        .conflict-badge { display: inline-block; background: #2d2310; color: #fdcb6e; border: 1px solid #fdcb6e; border-radius: 4px; font-size: 11px; padding: 2px 8px; white-space: nowrap; }
        .conflict-banner { background: #2d2310; color: #fdcb6e; border: 1px solid #fdcb6e; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; }
        .conflict-row td { background: #2d2310; }
        .toggle { position: relative; width: 40px; height: 20px; cursor: pointer; display: inline-block; }
        .toggle input { display: none; }
        .toggle-slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #333; border-radius: 20px; transition: 0.2s; }
        .toggle-slider:before { content: ''; position: absolute; height: 16px; width: 16px; left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: 0.2s; }
        .toggle input:checked + .toggle-slider { background: #00b894; }
        .toggle input:checked + .toggle-slider:before { transform: translateX(20px); }
        .section-title { color: #fff; font-size: 14px; font-weight: 600; margin: 16px 0 8px 0; padding-bottom: 6px; border-bottom: 1px solid #333; }
        .section-title-row { display: flex; align-items: center; gap: 8px; }
        .section-title-row .section-title { flex: 1; }
        .pagination-controls { display: flex; align-items: center; gap: 12px; margin-top: 10px; justify-content: center; }
        .pagination-info { font-size: 12px; color: #aaa; }
        .config-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        .config-row input { background: #0f0f0f; border: 1px solid #444; border-radius: 4px; color: #fff; padding: 6px 10px; font-size: 13px; }
        .config-row input:focus { outline: none; border-color: #6c5ce7; }
        .empty-state { text-align: center; padding: 32px; color: #555; font-size: 13px; }
        .update-badge { display: none; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; }
        .btn-update-install { background: #00b894; color: #fff; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>FLUXO</h1>
        <span id="versionLabel" class="version-label"></span>
        <span class="file-info" id="fileInfo"></span>
        <span id="updateBadge" class="update-badge"></span>
        <div class="header-actions">
            <button class="btn btn-outline btn-sm" data-action="open-file">📂 Abrir</button>
            <button class="btn btn-success btn-sm" data-action="save-file">💾 Salvar</button>
            <button class="btn btn-outline btn-sm" data-action="save-file-as">💾 Salvar Como</button>
            <span style="color:#444">|</span>
            <button class="btn btn-warning btn-sm" data-action="open-var-config">⚙ Config Variaveis</button>
            <button class="btn btn-primary btn-sm" data-action="open-schedules">📅 Agendamentos</button>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        <div class="recording-panel" id="recordingPanel">
            <div class="recording-panel-header">
                <h3>Modo Gravacao</h3>
                <span style="font-size: 12px; color: #888;" id="recordingTarget">Fluxo: ---</span>
                <button class="btn btn-outline btn-sm" data-action="close-recording" style="margin-left: auto;">✕ Fechar</button>
            </div>
            <div class="recording-panel-body">
                <div class="recording-tabs">
                    <button class="recording-tab active" data-action="switch-tab" data-arg="keys">⌨ Teclado</button>
                    <button class="recording-tab" data-action="switch-tab" data-arg="mouse">🖱 Mouse</button>
                    <button class="recording-tab" data-action="switch-tab" data-arg="vars">📦 Variaveis</button>
                    <button class="recording-tab" data-action="switch-tab" data-arg="delay">⏱ Delay</button>
                    <button class="recording-tab" data-action="switch-tab" data-arg="text">✏ Texto</button>
                </div>

                <div class="recording-section active" id="section-keys">
                    <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
                        <button class="record-btn" id="keyRecBtn" data-action="toggle-key-recording">⏺ Gravar Fisico</button>
                        <span style="font-size: 11px; color: #888;">Pressione teclas no teclado fisico ou clique nas abaixo</span>
                    </div>
                    <div id="keyboardContainer"></div>
                </div>

                <div class="recording-section" id="section-mouse">
                    <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
                        <button class="record-btn" id="globalCaptureBtn" data-action="toggle-global-capture">🖱 Captura Global</button>
                        <span style="font-size: 11px; color: #888;">Atalho: Ctrl+Shift+C</span>
                    </div>
                    <div class="mouse-coords">
                        <label>X: <input type="number" id="mouseX" value="0" min="0"></label>
                        <label>Y: <input type="number" id="mouseY" value="0" min="0"></label>
                        <button class="btn btn-outline btn-sm" data-action="add-mouse-action" data-arg="click">+ Click</button>
                        <button class="btn btn-outline btn-sm" data-action="add-mouse-action" data-arg="rightclick">+ Click Direito</button>
                        <button class="btn btn-outline btn-sm" data-action="add-mouse-action" data-arg="doubleclick">+ Duplo Click</button>
                    </div>
                </div>

                <div class="recording-section" id="section-vars">
                    <div style="font-size: 12px; color: #888; margin-bottom: 8px;">
                        Clique para adicionar. <span style="color:#e17055">ITEM_OBRIGATORIO</span> = item fixo. <span style="color:#00cec9">ITEM_OPCIONAL</span> = aleatorio do pool.
                    </div>
                    <div class="config-row">
                        <input type="text" id="varInput" placeholder="Nome da variavel" style="flex:1; background:#0f0f0f; border:1px solid #444; border-radius:4px; color:#fff; padding:6px 10px; font-size:13px;" />
                        <button class="btn btn-primary btn-sm" data-action="add-variable">+ Adicionar</button>
                    </div>
                    <div id="variablesContainer" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;"></div>
                </div>

                <div class="recording-section" id="section-delay">
                    <div style="font-size: 12px; color: #888; margin-bottom: 8px;">Adicione uma pausa entre acoes.</div>
                    <div class="delay-options">
                        <input type="number" id="delayInput" value="500" min="0" step="100" />
                        <span style="color: #888;">ms</span>
                        <button class="btn btn-outline btn-sm" data-action="add-delay-action">+ Adicionar</button>
                        <button class="delay-preset" data-action="delay-preset" data-arg="100">100ms</button>
                        <button class="delay-preset" data-action="delay-preset" data-arg="500">500ms</button>
                        <button class="delay-preset" data-action="delay-preset" data-arg="1000">1s</button>
                        <button class="delay-preset" data-action="delay-preset" data-arg="2000">2s</button>
                    </div>
                </div>

                <div class="recording-section" id="section-text">
                    <div style="font-size: 12px; color: #888; margin-bottom: 8px;">Digite um texto para ser inserido.</div>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="textInput" placeholder="Texto para digitar" style="flex:1; background:#0f0f0f; border:1px solid #444; border-radius:4px; color:#fff; padding:6px 10px; font-size:13px;" />
                        <button class="btn btn-primary btn-sm" data-action="add-text-action">+ Adicionar</button>
                    </div>
                </div>

                <div>
                    <div style="font-size: 12px; color: #888; margin-bottom: 6px;">Fila de acoes:</div>
                    <div class="recording-recorded" id="queueList"></div>
                    <div class="recording-actions">
                        <button class="btn btn-success btn-sm" data-action="add-queue-to-fluxo">✅ Adicionar ao Fluxo</button>
                        <button class="btn btn-outline btn-sm" data-action="clear-queue">Limpar Fila</button>
                    </div>
                </div>
            </div>
        </div>

        <div style="margin-bottom: 16px;">
            <button class="btn btn-primary" data-action="add-new-fluxo">+ Novo Fluxo</button>
        </div>

        <div class="fluxos-grid" id="fluxosGrid"></div>
    </div>

    <script>
        function showFatalError(err) {
            console.error(err);
            const div = document.createElement('div');
            div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#e17055;color:#fff;padding:12px;z-index:999999;font-family:Consolas,monospace;font-size:13px;white-space:pre-wrap;';
            div.textContent = 'Erro: ' + (err && err.message ? err.message : String(err));
            document.body.appendChild(div);
        }
        window.addEventListener('error', (e) => showFatalError(e.error || e.message));

        let app = null;
        try {
            const { App } = require('./dist/App');
            app = new App();
            app.init().catch(err => showFatalError(err));
        } catch (err) {
            showFatalError(err);
        }

        document.addEventListener('keydown', (e) => {
            const tag = e.target && e.target.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
            if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); app.undo(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'z' && e.shiftKey) { e.preventDefault(); app.redo(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); app.redo(); }
        });
    </script>
</body>
</html>
